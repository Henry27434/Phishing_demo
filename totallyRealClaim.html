<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim Your iPhone Android Pro Ultimate Maximum Plus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="ad-banner ad-left">
  <p class="ad-label">Advertisement</p>
  <div class="ad-track">
    <span class="dvd-bounce">Real Ad</span>
  </div>
</aside>

<main class="claim">
  <h1 class="claim-heading">Claim Your iPhone Android Pro Ultimate Maximum Plus</h1>

  <form class="claim-form" id="claimForm">
    <label for="fullname">Name</label>
    <input type="text" id="fullname" name="fullname">

    <label for="ssn">SSN</label>
    <input type="text" id="ssn" name="ssn">

    <label for="mmn">Mother's Maiden Name</label>
    <input type="text" id="mmn" name="mmn">

    <label for="lunch">Middle School Lunch Number</label>
    <input type="text" id="lunch" name="lunch">

    <svg class="point-arrow" viewBox="0 0 60 80" width="50" height="70" aria-hidden="true">
      <path d="M30 5 C10 25, 50 45, 30 70" fill="none" stroke="#2B0B3F" stroke-width="5" stroke-linecap="round"/>
      <path d="M18 58 L30 74 L42 58" fill="none" stroke="#2B0B3F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <button type="submit" class="cta-button">Claim Prize</button>
  </form>
</main>

<aside class="ad-banner ad-right">
  <p class="ad-label">Advertisement</p>
  <div class="ad-track">
    <span class="dvd-bounce">Real Ad</span>
  </div>
</aside>

<script src="script.js"></script>
</body>
</html>
